services:
  backend:
    build:
      context: ./backend
    environment:
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-20}
      AGMARKNET_SOURCE_URL: ${AGMARKNET_SOURCE_URL:-}
      ENAM_SOURCE_URL: ${ENAM_SOURCE_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:5174,http://localhost:5174}
    ports:
      - "8000:8000"
    volumes:
      - annapurna_data:/app/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5174:80"
    depends_on:
      - backend

volumes:
  annapurna_data:
