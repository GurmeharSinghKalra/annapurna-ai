# Rendered from /etc/nginx/templates/default.conf.template at container start, so
# BACKEND_ORIGIN can be set per environment.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 9m;
  client_body_timeout 30s;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), interest-cohort=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

  # A new deployment must not leave clients pinned to an older service worker.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    types { } default_type application/manifest+json;
    try_files $uri =404;
  }

  # Hashed build assets are immutable; the HTML entry point never is.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  # Keep browser API calls same-origin behind this container.
  #
  # `proxy_pass` with a literal hostname is resolved once at startup, so nginx refused to start
  # at all whenever the backend's DNS name was not yet resolvable — a cold-start race, or simply
  # starting the frontend on its own. Resolving through a variable defers the lookup to request
  # time, so the frontend serves the app and returns 502 for API calls until the backend appears.
  location ~ ^/api/(?<api_path>.*)$ {
    resolver ${DNS_RESOLVER} valid=10s ipv6=off;
    set $upstream ${BACKEND_ORIGIN};
    proxy_pass $upstream/$api_path$is_args$args;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    proxy_intercept_errors on;
    error_page 502 503 504 = @api_down;
  }

  location @api_down {
    default_type application/json;
    return 503 '{"detail":"The Annapurna API is not reachable right now. Please try again shortly."}';
  }

  # The app uses client-side routes such as /planner and /finance.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
