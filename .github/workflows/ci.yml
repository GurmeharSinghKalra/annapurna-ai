name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tests, migrations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app scripts tests

      - name: Format check
        run: ruff format --check app scripts tests

      - name: Train the optional crop model
        run: python scripts/train_model.py

      - name: Tests
        # No API keys are configured here on purpose: the suite must be hermetic, and the keys
        # below are set to prove that having them does not change the outcome.
        env:
          AGMARKNET_API_KEY: ci-should-not-matter
          OPENWEATHER_API_KEY: ci-should-not-matter
          GEMINI_API_KEY: ci-should-not-matter
        run: python -m pytest -q

      - name: Migrations apply and roll back cleanly
        env:
          DATABASE_URL: sqlite+aiosqlite:///./data/ci.db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  migrations-postgres:
    name: Migrations against PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: annapurna
          POSTGRES_PASSWORD: annapurna
          POSTGRES_DB: annapurna
        options: >-
          --health-cmd "pg_isready -U annapurna"
          --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Upgrade, downgrade, upgrade
        env:
          DATABASE_URL: postgresql://annapurna:annapurna@localhost:5432/annapurna
          JWT_SECRET: ci-secret-key-long-enough-for-validation-please
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
      - name: Fail if the build output is missing PWA assets
        run: |
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          test -f dist/icon.svg

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker build -f backend/Dockerfile -t annapurna-backend ./backend
      - run: docker build -f Dockerfile.frontend -t annapurna-frontend .
