name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Verify PWA assets are in the build output
        run: |
          for asset in index.html manifest.webmanifest icon.svg sw.js og.jpg; do
            test -f "dist/$asset" || { echo "missing dist/$asset"; exit 1; }
          done

  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Train the model
        working-directory: backend
        run: python scripts/train_model.py
      - name: Run tests
        working-directory: backend
        run: python -m pytest -q
      - name: Fail if the suite wrote into the project tree
        run: |
          if [ -f backend/data/annapurna_ai.sqlite ]; then
            echo "tests must not write to the project database"
            exit 1
          fi

  docker:
    name: Docker (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
      - name: Start the stack and check both services
        run: |
          docker compose up -d --wait
          curl --fail --silent --show-error http://127.0.0.1:8000/health
          curl --fail --silent --show-error http://127.0.0.1:5174/ > /dev/null
          # Client-side routes must resolve through the nginx history fallback.
          curl --fail --silent --show-error http://127.0.0.1:5174/dashboard > /dev/null
          # Assets referenced by index.html must actually exist in the image.
          curl --fail --silent --show-error http://127.0.0.1:5174/manifest.webmanifest > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:5174/sw.js > /dev/null
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
